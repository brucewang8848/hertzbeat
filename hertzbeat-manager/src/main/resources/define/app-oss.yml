# Monitor type category: mid-middleware monitoring
category: mid
# Monitor type identifier
app: oss
# Monitor type internationalization name
name:
  zh-CN: 阿里云 OSS 监控
  en-US: Alibaba Cloud OSS Monitor
# Monitor type description and help information
help:
  zh-CN: |
    HertzBeat 对阿里云对象存储服务 OSS 进行监控。
    支持多种操作类型：文件存在性检测、目录统计、Bucket 健康检查、Bucket 存储量统计等。
    对象键支持原子级日期变量：{yyyy}, {yy}, {MM}, {dd}, {HH}, {mm}, {ss}，可自由组合。
    您可以点击 "<i>新建 OSS 监控</i>" 并进行配置，或者选择"<i>更多操作</i>"，导入已有配置。
  en-US: |
    HertzBeat monitors Alibaba Cloud Object Storage Service (OSS).
    Supports multiple operation types: file existence check, directory statistics, bucket health check, bucket storage stat, etc.
    Object keys support atomic date variables: {yyyy}, {yy}, {MM}, {dd}, {HH}, {mm}, {ss}.
    You can click "<i>New OSS Monitor</i>" and configure it, or select "<i>More Actions</i>" to import an existing configuration.
helpLink:
  zh-CN: https://hertzbeat.apache.org/zh-cn/docs/help/oss
  en-US: https://hertzbeat.apache.org/docs/help/oss
# Monitor input parameter definition
params:
  - field: endpoint
    name:
      zh-CN: 服务端点
      en-US: Endpoint
    type: text
    required: true
    placeholder: 'https://oss-cn-hangzhou.aliyuncs.com'
  - field: accessKey
    name:
      zh-CN: Access Key
      en-US: Access Key
    type: text
    required: true
  - field: secretKey
    name:
      zh-CN: Secret Key
      en-US: Secret Key
    type: password
    required: true
  - field: bucket
    name:
      zh-CN: Bucket名称
      en-US: Bucket Name
    type: text
    required: true
  - field: objectKey
    name:
      zh-CN: 对象键
      en-US: Object Key
    type: text
    required: false
    placeholder: 'data/{yyyy}/{MM}/{dd}/report.csv'
  - field: timezone
    name:
      zh-CN: 时区
      en-US: Timezone
    type: text
    required: false
    placeholder: 'Asia/Shanghai'
  - field: timeout
    name:
      zh-CN: 超时时间(ms)
      en-US: Timeout(ms)
    type: number
    range: '[0,300000]'
    required: true
    defaultValue: 30000
# Metrics collection configuration list
metrics:
  # Metric - File existence check
  - name: fileCheck
    i18n:
      zh-CN: 文件检测
      en-US: File Check
    priority: 0
    fields:
      - field: objectKey
        type: 1
        i18n:
          zh-CN: 对象键
          en-US: Object Key
      - field: exists
        type: 1
        i18n:
          zh-CN: 文件存在
          en-US: File Exists
      - field: fileSize
        type: 0
        unit: B
        i18n:
          zh-CN: 文件大小
          en-US: File Size
      - field: lastModified
        type: 1
        i18n:
          zh-CN: 最后修改时间
          en-US: Last Modified
      - field: responseTime
        type: 0
        unit: ms
        i18n:
          zh-CN: 响应时间
          en-US: Response Time
    aliasFields:
      - objectKey
      - exists
      - fileSize
      - lastModified
      - responseTime
    protocol: oss
    oss:
      operation: headObject
      endpoint: ^_^endpoint^_^
      accessKey: ^_^accessKey^_^
      secretKey: ^_^secretKey^_^
      bucket: ^_^bucket^_^
      objectKey: ^_^objectKey^_^
      timezone: ^_^timezone^_^
      timeout: ^_^timeout^_^

  # Metric - Directory statistics
  - name: dirStats
    i18n:
      zh-CN: 目录统计
      en-US: Directory Statistics
    priority: 1
    fields:
      - field: prefix
        type: 1
        i18n:
          zh-CN: 前缀
          en-US: Prefix
      - field: fileCount
        type: 0
        i18n:
          zh-CN: 文件数量
          en-US: File Count
      - field: totalSize
        type: 0
        unit: B
        i18n:
          zh-CN: 总大小
          en-US: Total Size
      - field: latestFile
        type: 1
        i18n:
          zh-CN: 最新文件
          en-US: Latest File
      - field: latestModified
        type: 1
        i18n:
          zh-CN: 最新修改时间
          en-US: Latest Modified
      - field: responseTime
        type: 0
        unit: ms
        i18n:
          zh-CN: 响应时间
          en-US: Response Time
    aliasFields:
      - prefix
      - fileCount
      - totalSize
      - latestFile
      - latestModified
      - responseTime
    protocol: oss
    oss:
      operation: listObjects
      endpoint: ^_^endpoint^_^
      accessKey: ^_^accessKey^_^
      secretKey: ^_^secretKey^_^
      bucket: ^_^bucket^_^
      objectKey: ^_^objectKey^_^
      timezone: ^_^timezone^_^
      timeout: ^_^timeout^_^

  # Metric - Bucket health check
  - name: bucketHealth
    i18n:
      zh-CN: Bucket健康
      en-US: Bucket Health
    priority: 2
    fields:
      - field: bucket
        type: 1
        i18n:
          zh-CN: Bucket名称
          en-US: Bucket Name
      - field: exists
        type: 1
        i18n:
          zh-CN: Bucket存在
          en-US: Bucket Exists
      - field: accessible
        type: 1
        i18n:
          zh-CN: 可访问
          en-US: Accessible
      - field: responseTime
        type: 0
        unit: ms
        i18n:
          zh-CN: 响应时间
          en-US: Response Time
    aliasFields:
      - bucket
      - exists
      - accessible
      - responseTime
    protocol: oss
    oss:
      operation: headBucket
      endpoint: ^_^endpoint^_^
      accessKey: ^_^accessKey^_^
      secretKey: ^_^secretKey^_^
      bucket: ^_^bucket^_^
      timeout: ^_^timeout^_^

  # Metric - Bucket storage statistics (OSS-specific)
  - name: bucketStorageStat
    i18n:
      zh-CN: Bucket存储统计
      en-US: Bucket Storage Stat
    priority: 3
    fields:
      - field: bucket
        type: 1
        i18n:
          zh-CN: Bucket名称
          en-US: Bucket Name
      - field: bucketSize
        type: 0
        unit: B
        i18n:
          zh-CN: Bucket总大小
          en-US: Bucket Total Size
      - field: objectCount
        type: 0
        i18n:
          zh-CN: 对象数量
          en-US: Object Count
      - field: responseTime
        type: 0
        unit: ms
        i18n:
          zh-CN: 响应时间
          en-US: Response Time
    aliasFields:
      - bucket
      - bucketSize
      - objectCount
      - responseTime
    protocol: oss
    oss:
      operation: getBucketStorageInfo
      endpoint: ^_^endpoint^_^
      accessKey: ^_^accessKey^_^
      secretKey: ^_^secretKey^_^
      bucket: ^_^bucket^_^
      timeout: ^_^timeout^_^
